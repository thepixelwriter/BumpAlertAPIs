version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bumpalert-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bumpalert
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - bumpalert-postgres-data:/var/lib/postgresql/data

volumes:
  bumpalert-postgres-data:
